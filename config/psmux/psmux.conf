# psmux is tmux-like, but it does not implement every tmux option.
# Keep this file limited to options documented by `psmux --help`.
set -g default-shell pwsh
set -g focus-events on
set -g escape-time 0
set -g history-limit 100000
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi

set -g prefix C-b
bind C-b send-prefix

bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.psmux.conf \; display-message "psmux config reloaded"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#05070a,fg=#b1bac4"
set -g status-left " [#S] "
set -g status-right " #H | %Y-%m-%d %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format "[#I:#W]"
set -g window-status-current-style "bold,fg=#58a6ff"
set -g pane-border-style "fg=#21262d"
set -g pane-active-border-style "fg=#388bfd"
