# Terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys:clipboard"
set -as terminal-features ",xterm-256color:RGB:extkeys:clipboard"
set -as terminal-features ",screen-256color:RGB"
set -s extended-keys on
set -g focus-events on
set -g set-clipboard on

# Neovim responsiveness and session behavior
set -sg escape-time 0
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g mode-keys vi
set -g status-keys vi

# Keep the default prefix so readline's Ctrl-a remains available.
set -g prefix C-b
bind C-b send-prefix

# New panes and windows inherit the active pane's working directory.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Prefix-based navigation never steals Neovim's raw Ctrl keys.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-style selection. With set-clipboard enabled, tmux uses the terminal's
# clipboard capability (including OSC 52 where supported).
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Plain ASCII status line
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#161b22,fg=#c9d1d9"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left " [#S] "
set -g status-right " #H | %Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "[#I:#W]"
setw -g window-status-current-style "bold,fg=#58a6ff"
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#58a6ff"
